<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Chat</title>
    <style>
        :root {
            --bg: #ffffff;
            --fg: #1f2328;
            --muted: #6e7781;
            --border: #d8dee4;
            --user-bg: #f0f2f5;
            --accent: #0969da;
            --success: #1a7f37;
            --danger: #cf222e;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0d1117;
                --fg: #e6edf3;
                --muted: #8b949e;
                --border: #30363d;
                --user-bg: #161b22;
                --accent: #58a6ff;
                --success: #3fb950;
                --danger: #f85149;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font: 15px/1.5 system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--fg);
        }
        main {
            max-width: 760px;
            height: 100dvh;
            margin: 0 auto;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
        }
        header h1 { font-size: 16px; margin: 0; }
        header small { color: var(--muted); font-family: ui-monospace, monospace; }
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 0;
        }
        .message { margin-bottom: 20px; white-space: pre-wrap; word-wrap: break-word; }
        .message.user {
            margin-left: auto;
            max-width: 80%;
            width: fit-content;
            padding: 8px 14px;
            border-radius: 16px;
            background: var(--user-bg);
        }
        .message.error { color: var(--danger); }
        .sources { margin-top: 8px; font-size: 13px; color: var(--muted); white-space: normal; }
        .sources a { color: var(--accent); margin-right: 12px; }
        #form {
            display: flex;
            gap: 8px;
            padding: 16px 0;
            border-top: 1px solid var(--border);
        }
        textarea {
            flex: 1;
            resize: none;
            padding: 10px 12px;
            font: inherit;
            color: inherit;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
        }
        button {
            padding: 0 16px;
            font: inherit;
            color: var(--fg);
            background: var(--user-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
        }
        button:disabled { opacity: .5; cursor: default; }
        header button { padding: 4px 10px; font-size: 13px; }
        #documents { padding: 8px 0; border-bottom: 1px solid var(--border); }
        #documents summary { cursor: pointer; font-size: 14px; color: var(--muted); }
        #upload-form { display: flex; gap: 8px; align-items: center; margin: 12px 0 8px; }
        #upload-form input { flex: 1; min-width: 0; font-size: 13px; }
        #upload-form button { padding: 6px 12px; }
        #upload-status { font-size: 13px; color: var(--muted); }
        #upload-status.error { color: var(--danger); }
        #document-list { list-style: none; margin: 0; padding: 0; max-height: 30vh; overflow-y: auto; }
        #document-list li {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px 8px;
            padding: 6px 0;
            font-size: 14px;
            border-top: 1px solid var(--border);
        }
        #document-list li:first-child { border-top: none; }
        #document-list li button { padding: 2px 8px; font-size: 12px; }
        .document-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg); }
        .document-error { flex-basis: 100%; font-size: 12px; color: var(--danger); }
        .badge { font-size: 12px; padding: 0 8px; border: 1px solid currentColor; border-radius: 999px; white-space: nowrap; }
        .badge.PENDING { color: var(--muted); }
        .badge.PROCESSING { color: var(--accent); }
        .badge.READY { color: var(--success); }
        .badge.FAILED { color: var(--danger); }
    </style>
</head>
<body>
<main>
    <header>
        <div>
            <h1>AI Chat</h1>
            <small id="conversation"></small>
        </div>
        <button id="new-conversation" type="button">Nueva conversación</button>
    </header>
    <details id="documents">
        <summary>Documentos <span id="document-count"></span></summary>
        <form id="upload-form">
            <input id="file" type="file" required>
            <button id="upload" type="submit">Subir</button>
        </form>
        <div id="upload-status"></div>
        <ul id="document-list"></ul>
    </details>
    <div id="messages"></div>
    <form id="form">
        <textarea id="input" rows="2" placeholder="Escribe un mensaje… (Enter para enviar, Shift+Enter para salto de línea)" required></textarea>
        <button id="send" type="submit">Enviar</button>
    </form>
</main>

<script>
    const messages = document.getElementById('messages');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const conversationLabel = document.getElementById('conversation');
    const documentsPanel = document.getElementById('documents');
    const documentCount = document.getElementById('document-count');
    const documentList = document.getElementById('document-list');
    const uploadForm = document.getElementById('upload-form');
    const fileInput = document.getElementById('file');
    const uploadButton = document.getElementById('upload');
    const uploadStatus = document.getElementById('upload-status');

    const POLL_INTERVAL_MS = 2000;
    const ACTIVE_STATUSES = new Set(['PENDING', 'PROCESSING']);
    const STATUS_LABELS = { PENDING: 'En cola', PROCESSING: 'Procesando', READY: 'Listo', FAILED: 'Error' };
    const FILE_TOO_LARGE = 'El fichero es demasiado grande';
    let pollTimer = null;
    let maxFileSizeBytes = null;
    let loadFailed = false;

    let conversationId = loadConversationId();

    function loadConversationId() {
        let id = null;
        try { id = localStorage.getItem('conversationId'); } catch {}
        return id ?? newConversationId();
    }

    function newConversationId() {
        const id = crypto.randomUUID();
        try { localStorage.setItem('conversationId', id); } catch {}
        return id;
    }

    function renderConversation() {
        conversationLabel.textContent = conversationId;
    }

    function addMessage(role, text = '') {
        const element = document.createElement('div');
        element.className = `message ${role}`;
        element.textContent = text;
        messages.appendChild(element);
        messages.scrollTop = messages.scrollHeight;
        return element;
    }

    function renderSources(container, sources) {
        if (!sources.length) return;
        const element = document.createElement('div');
        element.className = 'sources';
        element.append('Fuentes: ');
        const unique = new Map(sources.map(source => [source.documentId ?? source.fileName, source]));
        for (const source of unique.values()) {
            const link = document.createElement('a');
            link.textContent = source.fileName;
            link.href = source.downloadUrl ?? '#';
            link.title = source.excerpt;
            element.appendChild(link);
        }
        container.appendChild(element);
    }

    // Parses an SSE stream from fetch() (EventSource only supports GET)
    async function* readEvents(response) {
        const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
        let buffer = '';
        while (true) {
            const { value, done } = await reader.read();
            if (done) return;
            buffer += value.replace(/\r\n/g, '\n');
            let boundary;
            while ((boundary = buffer.indexOf('\n\n')) !== -1) {
                const raw = buffer.slice(0, boundary);
                buffer = buffer.slice(boundary + 2);
                let event = 'message';
                const data = [];
                for (const line of raw.split('\n')) {
                    if (line.startsWith('event:')) event = line.slice(6).trim();
                    else if (line.startsWith('data:')) data.push(line.slice(5).replace(/^ /, ''));
                }
                if (data.length) yield { event, data: JSON.parse(data.join('\n')) };
            }
        }
    }

    async function sendMessage(message) {
        addMessage('user', message);
        const assistant = addMessage('assistant');
        const text = document.createTextNode('');
        assistant.appendChild(text);
        let sources = [];

        try {
            const response = await fetch(`/api/v1/conversations/${conversationId}/messages/stream`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream' },
                body: JSON.stringify({ message })
            });
            if (!response.ok) throw new Error(await errorMessage(response));

            for await (const { event, data } of readEvents(response)) {
                if (event === 'sources') sources = data;
                else if (event === 'token') text.appendData(data.content);
                else if (event === 'error') throw new Error(data.message);
                else if (event === 'done') renderSources(assistant, sources);
                messages.scrollTop = messages.scrollHeight;
            }
        } catch (error) {
            assistant.classList.add('error');
            text.appendData(`${text.length ? '\n\n' : ''}⚠ ${error.message}`);
        }
    }

    async function errorMessage(response) {
        try {
            const problem = await response.json();
            if (problem.detail) return problem.detail;
        } catch {}
        return `HTTP ${response.status}`;
    }

    function showUploadStatus(text, isError = false) {
        uploadStatus.textContent = text;
        uploadStatus.classList.toggle('error', isError);
    }

    function renderDocuments(documents) {
        documentCount.textContent = `(${documents.length})`;
        documentList.replaceChildren(...documents.map(renderDocument));
    }

    function renderDocument(doc) {
        const status = doc.status;
        const item = document.createElement('li');

        const name = document.createElement('a');
        name.className = 'document-name';
        name.textContent = doc.name;
        name.title = doc.name;
        name.href = `/api/v1/documents/${doc.id}/download`;

        const badge = document.createElement('span');
        badge.className = `badge ${status}`;
        badge.textContent = STATUS_LABELS[status] ?? status;

        const remove = document.createElement('button');
        remove.type = 'button';
        remove.textContent = 'Borrar';
        remove.addEventListener('click', () => deleteDocument(doc));

        item.append(name, badge, remove);

        if (status === 'FAILED' && doc.errorMessage) {
            const error = document.createElement('div');
            error.className = 'document-error';
            error.textContent = doc.errorMessage;
            item.appendChild(error);
        }
        return item;
    }

    function schedulePoll() {
        if (documentsPanel.open && !document.hidden) {
            pollTimer = setTimeout(loadDocuments, POLL_INTERVAL_MS);
        }
    }

    async function loadUploadLimits() {
        try {
            const response = await fetch('/api/v1/documents/limits');
            if (response.ok) maxFileSizeBytes = (await response.json()).maxFileSizeBytes;
        } catch {}
    }

    async function loadDocuments() {
        clearTimeout(pollTimer);
        try {
            const response = await fetch('/api/v1/documents');
            if (!response.ok) throw new Error(await errorMessage(response));
            const documents = await response.json();
            renderDocuments(documents);
            if (loadFailed) {
                loadFailed = false;
                showUploadStatus('');
            }
            if (documents.some(doc => ACTIVE_STATUSES.has(doc.status))) schedulePoll();
        } catch (error) {
            loadFailed = true;
            showUploadStatus(`No se pudieron cargar los documentos: ${error.message}`, true);
            schedulePoll();
        }
    }

    documentsPanel.addEventListener('toggle', () => documentsPanel.open ? loadDocuments() : clearTimeout(pollTimer));
    document.addEventListener('visibilitychange', () => document.hidden ? clearTimeout(pollTimer) : loadDocuments());

    async function deleteDocument(doc) {
        if (!confirm(`¿Borrar "${doc.name}"?`)) return;
        try {
            const response = await fetch(`/api/v1/documents/${doc.id}`, { method: 'DELETE' });
            if (!response.ok && response.status !== 404) throw new Error(await errorMessage(response));
        } catch (error) {
            showUploadStatus(`No se pudo borrar: ${error.message}`, true);
        }
        await loadDocuments();
    }

    uploadForm.addEventListener('submit', async event => {
        event.preventDefault();
        const file = fileInput.files[0];
        if (!file) return;
        if (maxFileSizeBytes !== null && file.size > maxFileSizeBytes) {
            showUploadStatus(FILE_TOO_LARGE, true);
            return;
        }
        const body = new FormData();
        body.append('file', file);

        uploadButton.disabled = true;
        showUploadStatus(`Subiendo ${file.name}…`);
        try {
            const response = await fetch('/api/v1/documents', { method: 'POST', body });
            if (!response.ok) throw new Error(await errorMessage(response));
            uploadForm.reset();
            showUploadStatus('');
        } catch (error) {
            showUploadStatus(error.message, true);
        } finally {
            uploadButton.disabled = false;
        }
        await loadDocuments();
    });

    form.addEventListener('submit', async event => {
        event.preventDefault();
        const message = input.value.trim();
        if (!message) return;
        input.value = '';
        send.disabled = true;
        await sendMessage(message);
        send.disabled = false;
        input.focus();
    });

    input.addEventListener('keydown', event => {
        if (event.key === 'Enter' && !event.shiftKey && !send.disabled) {
            event.preventDefault();
            form.requestSubmit();
        }
    });

    document.getElementById('new-conversation').addEventListener('click', () => {
        conversationId = newConversationId();
        messages.replaceChildren();
        renderConversation();
        input.focus();
    });

    renderConversation();
    loadUploadLimits();
    loadDocuments();
    input.focus();
</script>
</body>
</html>
