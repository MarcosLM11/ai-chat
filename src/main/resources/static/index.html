<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Chat</title>
    <style>
        :root {
            --bg: #ffffff;
            --fg: #1f2328;
            --muted: #6e7781;
            --border: #d8dee4;
            --user-bg: #f0f2f5;
            --accent: #0969da;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0d1117;
                --fg: #e6edf3;
                --muted: #8b949e;
                --border: #30363d;
                --user-bg: #161b22;
                --accent: #58a6ff;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font: 15px/1.5 system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--fg);
        }
        main {
            max-width: 760px;
            height: 100dvh;
            margin: 0 auto;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
        }
        header h1 { font-size: 16px; margin: 0; }
        header small { color: var(--muted); font-family: ui-monospace, monospace; }
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 0;
        }
        .message { margin-bottom: 20px; white-space: pre-wrap; word-wrap: break-word; }
        .message.user {
            margin-left: auto;
            max-width: 80%;
            width: fit-content;
            padding: 8px 14px;
            border-radius: 16px;
            background: var(--user-bg);
        }
        .message.error { color: #cf222e; }
        .sources { margin-top: 8px; font-size: 13px; color: var(--muted); white-space: normal; }
        .sources a { color: var(--accent); margin-right: 12px; }
        form {
            display: flex;
            gap: 8px;
            padding: 16px 0;
            border-top: 1px solid var(--border);
        }
        textarea {
            flex: 1;
            resize: none;
            padding: 10px 12px;
            font: inherit;
            color: inherit;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
        }
        button {
            padding: 0 16px;
            font: inherit;
            color: var(--fg);
            background: var(--user-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
        }
        button:disabled { opacity: .5; cursor: default; }
        header button { padding: 4px 10px; font-size: 13px; }
    </style>
</head>
<body>
<main>
    <header>
        <div>
            <h1>AI Chat</h1>
            <small id="conversation"></small>
        </div>
        <button id="new-conversation" type="button">Nueva conversación</button>
    </header>
    <div id="messages"></div>
    <form id="form">
        <textarea id="input" rows="2" placeholder="Escribe un mensaje… (Enter para enviar, Shift+Enter para salto de línea)" required></textarea>
        <button id="send" type="submit">Enviar</button>
    </form>
</main>

<script>
    const messages = document.getElementById('messages');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const conversationLabel = document.getElementById('conversation');

    let conversationId = loadConversationId();

    function loadConversationId() {
        let id = null;
        try { id = localStorage.getItem('conversationId'); } catch {}
        return id ?? newConversationId();
    }

    function newConversationId() {
        const id = crypto.randomUUID();
        try { localStorage.setItem('conversationId', id); } catch {}
        return id;
    }

    function renderConversation() {
        conversationLabel.textContent = conversationId;
    }

    function addMessage(role, text = '') {
        const element = document.createElement('div');
        element.className = `message ${role}`;
        element.textContent = text;
        messages.appendChild(element);
        messages.scrollTop = messages.scrollHeight;
        return element;
    }

    function renderSources(container, sources) {
        if (!sources.length) return;
        const element = document.createElement('div');
        element.className = 'sources';
        element.append('Fuentes: ');
        const unique = new Map(sources.map(source => [source.documentId ?? source.fileName, source]));
        for (const source of unique.values()) {
            const link = document.createElement('a');
            link.textContent = source.fileName;
            link.href = source.downloadUrl ?? '#';
            link.title = source.excerpt;
            element.appendChild(link);
        }
        container.appendChild(element);
    }

    // Parses an SSE stream from fetch() (EventSource only supports GET)
    async function* readEvents(response) {
        const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
        let buffer = '';
        while (true) {
            const { value, done } = await reader.read();
            if (done) return;
            buffer += value.replace(/\r\n/g, '\n');
            let boundary;
            while ((boundary = buffer.indexOf('\n\n')) !== -1) {
                const raw = buffer.slice(0, boundary);
                buffer = buffer.slice(boundary + 2);
                let event = 'message';
                const data = [];
                for (const line of raw.split('\n')) {
                    if (line.startsWith('event:')) event = line.slice(6).trim();
                    else if (line.startsWith('data:')) data.push(line.slice(5).replace(/^ /, ''));
                }
                if (data.length) yield { event, data: JSON.parse(data.join('\n')) };
            }
        }
    }

    async function sendMessage(message) {
        addMessage('user', message);
        const assistant = addMessage('assistant');
        const text = document.createTextNode('');
        assistant.appendChild(text);
        let sources = [];

        try {
            const response = await fetch(`/api/v1/conversations/${conversationId}/messages/stream`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream' },
                body: JSON.stringify({ message })
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            for await (const { event, data } of readEvents(response)) {
                if (event === 'sources') sources = data;
                else if (event === 'token') text.appendData(data.content);
                else if (event === 'error') throw new Error(data.message);
                else if (event === 'done') renderSources(assistant, sources);
                messages.scrollTop = messages.scrollHeight;
            }
        } catch (error) {
            assistant.classList.add('error');
            text.appendData(`${text.length ? '\n\n' : ''}⚠ ${error.message}`);
        }
    }

    form.addEventListener('submit', async event => {
        event.preventDefault();
        const message = input.value.trim();
        if (!message) return;
        input.value = '';
        send.disabled = true;
        await sendMessage(message);
        send.disabled = false;
        input.focus();
    });

    input.addEventListener('keydown', event => {
        if (event.key === 'Enter' && !event.shiftKey && !send.disabled) {
            event.preventDefault();
            form.requestSubmit();
        }
    });

    document.getElementById('new-conversation').addEventListener('click', () => {
        conversationId = newConversationId();
        messages.replaceChildren();
        renderConversation();
        input.focus();
    });

    renderConversation();
    input.focus();
</script>
</body>
</html>
