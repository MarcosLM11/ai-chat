server:
  port: 8080

spring:
  application:
    name: ai-chat

  servlet:
    multipart:
      max-file-size: 40MB
      max-request-size: 80MB

  datasource:
    url: jdbc:postgresql://localhost:5432/ai-chat
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin123}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        model: gpt-4o-mini
        temperature: 0.5
      embedding:
        model: text-embedding-3-small
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536

app:
  rag:
    similarity-threshold: 0.3
    top-k: 5

logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG
